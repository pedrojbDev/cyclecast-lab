[project]
name = "cyclecast-lab"
version = "1.0.0"
description = "Causal next-day bike demand forecasting"
requires-python = ">=3.11,<3.13"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1", "numpy>=2,<3", "scikit-learn>=1.5,<2"]
[dependency-groups]
dev = ["httpx>=0.27,<1", "pytest>=8,<10", "ruff>=0.8,<1"]
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
[tool.hatch.build.targets.wheel]
packages = ["src/cyclecast"]
[tool.ruff]
line-length = 100
